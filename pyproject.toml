[project]
name = "IA generated text Clasiffier"
version = "0.2.0"
description = "Training a model to detect IA generated text "
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "lightning>=2.6.5",
    "matplotlib>=3.10.6",
    "notebook>=7.0.0",
    "numpy<2",
    "pandas>=2.3.2",
    "pdoc>=16.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]
[tool.setuptools.packages.find]
where = ["src"]
